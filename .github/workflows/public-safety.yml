name: Public safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git fetch --quiet origin "$GITHUB_SHA" --depth=1
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Validate public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          bad_files="$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)|credentials.*\.json$|service-account.*\.json$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden credential/config filenames are tracked."
            printf '%s\n' "$bad_files"
            exit 1
          fi

          test -f README.md
          test -f SECURITY.md
          grep -Fq 'Production application repositories remain private' README.md
          grep -Fq 'Public GitHub content must never contain' README.md
          # Public copy stays vendor-neutral: no third-party tool, platform or
          # provider names in any published document.
          pattern='(n8n|zapier|openai|anthropic|paystack|flutterwave|monnify|vtpass|resend|railway|cloudflare|vercel|supabase|mongodb|sentry|posthog|shopify|wordpress|amazon web services|datadog)'
          hits="$(git ls-files '*.md' | xargs grep -inE "\\b${pattern}\\b" || true)"
          if [ -n "$hits" ]; then
            echo "Vendor names found in public documents:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "Public repository boundary checks passed."
